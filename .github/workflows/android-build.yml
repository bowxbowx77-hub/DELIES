name: Android build

# Manual runs from the Actions tab, and every push to a working branch.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Gradle task to run"
        required: false
        default: "assembleDebug"
        type: choice
        options:
          - assembleDebug
          - assembleRelease
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-tests:
    name: Web app tests (jsdom)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install test dependencies
        run: npm ci

      - name: Run web test suite
        run: npm test

  android:
    name: Build DELIES APK
    runs-on: ubuntu-latest
    needs: web-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Verify the web app sources are present
        run: |
          set -euo pipefail
          test -f main/index.html
          test -f main/js/app.js
          echo "Web app sources: $(find main -type f | wc -l) files"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Lint (report only)
        working-directory: android
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble APK
        working-directory: android
        run: |
          set -euo pipefail
          TASK="${{ github.event.inputs.build_type || 'assembleDebug' }}"
          echo "Running :app:$TASK"
          ./gradlew --no-daemon --stacktrace ":app:$TASK"

      - name: Verify APK and collect metadata
        id: apk
        working-directory: android
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::APK looks broken ($SIZE bytes)"
            exit 1
          fi
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          {
            echo "path=$APK"
            echo "size=$SIZE"
            echo "sha256=$SHA"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### DELIES APK"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | $VERSION |"
            echo "| Size | $SIZE bytes |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| Path | \`$APK\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$APK" | grep -c 'assets/www/' | xargs -I{} echo "Embedded web assets entries: {}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DELIES-Android-APK
          path: ${{ steps.apk.outputs.path || 'android/app/build/outputs/apk/**/*.apk' }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
