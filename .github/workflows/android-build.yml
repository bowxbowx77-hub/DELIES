name: Android build

# Manual runs from the Actions tab, and every push to a working branch.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Gradle task to run"
        required: false
        default: "assembleDebug"
        type: choice
        options:
          - assembleDebug
          - assembleRelease
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_LOG: ${{ github.workspace }}/build-log.txt

jobs:
  web-tests:
    name: Web app tests (jsdom)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install test dependencies
        run: npm ci

      - name: Run web test suite
        run: npm test

  android:
    name: Build DELIES APK
    runs-on: ubuntu-latest
    needs: web-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Verify the web app sources are present
        run: |
          set -euo pipefail
          test -f main/index.html
          test -f main/js/app.js
          echo "Web app sources: $(find main -type f | wc -l) files"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run Android unit tests
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee "$GRADLE_LOG"

      - name: Publish unit test summary
        if: always()
        working-directory: android
        run: |
          python3 - "$PWD" <<'PYEOF'
          import glob, sys, xml.etree.ElementTree as ET
          total = failures = skipped = 0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(path).getroot()
              total += int(root.get('tests', 0))
              failures += int(root.get('failures', 0)) + int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
          print(f"::notice title=Android unit tests::{total} tests, {failures} failed, {skipped} skipped")
          PYEOF

      - name: Lint (report only)
        working-directory: android
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Publish lint summary
        if: always()
        working-directory: android
        run: |
          FILE=app/build/reports/lint-results-debug.txt
          if [ -f "$FILE" ]; then
            WARNINGS=$(grep -c 'Warning:' "$FILE" || true)
            ERRORS=$(grep -c 'Error:' "$FILE" || true)
            echo "::notice title=Android lint::${WARNINGS} warnings, ${ERRORS} errors (report only, non-blocking)"
            grep -B0 -A2 'Error:' "$FILE" | head -40 | tr -d '\r' | while IFS= read -r line; do
              case "$line" in
                "") ;;
                *) echo "::warning title=Lint error::$(printf '%s' "$line" | cut -c1-900)" ;;
              esac
            done
          else
            echo "lint report not found"
          fi


      - name: Assemble APK
        working-directory: android
        run: |
          set -euo pipefail
          TASK="${{ github.event.inputs.build_type || 'assembleDebug' }}"
          echo "Running :app:$TASK"
          ./gradlew --no-daemon --stacktrace ":app:$TASK" 2>&1 | tee -a "$GRADLE_LOG"

      # Gradle output is surfaced as check-run annotations so failures are
      # readable without downloading the full log archive.
      - name: Report Gradle errors as annotations
        if: failure()
        run: |
          echo "## Build log excerpt" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$GRADLE_LOG" ]; then
            grep -E "^e: |error:|FAILURE:|Execution failed|> Task .* FAILED|Unresolved reference|missing return" "$GRADLE_LOG" \
              | head -25 \
              | while IFS= read -r line; do
                  clean=$(printf '%s' "$line" | tr -d '\r' | tr '\n' ' ' | cut -c1-900)
                  echo "::error title=Gradle::$clean"
                done
            { echo '```'; tail -30 "$GRADLE_LOG"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Verify APK and collect metadata
        id: apk
        working-directory: android
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::APK looks broken ($SIZE bytes)"
            exit 1
          fi
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          APK_ABS="$(cd "$(dirname "$APK")" && pwd)/$(basename "$APK")"
          {
            echo "path=$APK_ABS"
            echo "size=$SIZE"
            echo "sha256=$SHA"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### DELIES APK"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | $VERSION |"
            echo "| Size | $SIZE bytes |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| Path | \`$APK\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Embedded web asset entries: $(unzip -l "$APK" | grep -c 'assets/www/')"

      # The artifact itself is the deliverable; this step proves its contents
      # (package id, version, permissions, embedded web app) inside the run.
      - name: Inspect APK contents
        working-directory: android
        run: |
          set -uo pipefail
          APK="$(find app/build/outputs/apk -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then echo "::error::APK missing"; exit 1; fi
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)

          AAPT="$(ls "${ANDROID_HOME}"/build-tools/*/aapt2 2>/dev/null | tail -n 1)"
          if [ -n "${AAPT:-}" ]; then
            BADGING="$("$AAPT" dump badging "$APK" 2>/dev/null || true)"
            PKG="$(printf '%s' "$BADGING" | grep -m1 '^package:' || true)"
            SDK="$(printf '%s' "$BADGING" | grep -m1 '^sdkVersion:' || true)"
            TARGET="$(printf '%s' "$BADGING" | grep -m1 '^targetSdkVersion:' || true)"
            PERMS="$(printf '%s' "$BADGING" | grep '^uses-permission:' | sed "s/uses-permission: name='//;s/'\$//" | tr '\n' ' ' || true)"
            echo "::notice title=APK package id and version::${PKG}"
            echo "::notice title=APK SDK levels::${SDK} ${TARGET}"
            echo "::notice title=APK permissions::${PERMS}"
          else
            echo "aapt2 not found, skipping badging"
          fi

          ENTRIES=$(unzip -l "$APK" | grep -c 'assets/www/' || true)
          INDEX=$(unzip -l "$APK" | grep -c 'assets/www/index.html' || true)
          APPFILE=$(unzip -l "$APK" | grep -c 'assets/www/js/app.js' || true)
          echo "::notice title=APK size and hash::${SIZE} bytes, sha256 ${SHA}"
          echo "::notice title=APK embedded web app::${ENTRIES} asset entries, index.html=${INDEX}, js/app.js=${APPFILE}"

          if [ "${INDEX:-0}" -lt 1 ]; then echo "::error::index.html is not inside the APK"; exit 1; fi
          if [ "${APPFILE:-0}" -lt 1 ]; then echo "::error::js/app.js is not inside the APK"; exit 1; fi
          if [ "${ENTRIES:-0}" -lt 30 ]; then echo "::error::web assets are incomplete ($ENTRIES entries)"; exit 1; fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DELIES-Android-APK
          path: ${{ steps.apk.outputs.path || 'android/app/build/outputs/apk/**/*.apk' }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: |
            android/app/build/reports/tests/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
